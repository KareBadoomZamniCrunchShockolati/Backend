services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: challenge_app_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: emad123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  maildev:
    image: maildev/maildev
    ports:
      - "1025:1025"  # SMTP server
      - "1080:1080"  # Web UI

  backend:
    image: backend-app:latest
    environment:
      # Database
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: emad123
      DB_NAME: challenge_app_dev
      DB_PORT: 5432
      DB_SSL_MODE: disable
      
      # JWT
      JWT_SECRET_KEY: hello kitty
      
      # Email
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_USER: a
      SMTP_PASS: aa
      EMAIL_FROM: noreply@yourapp.com
      
      # Redis
      REDIS_ADDR: redis
      REDIS_PASS: ""
      REDIS_DB: 0
      
      # App
      APP_MODE: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      maildev:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: